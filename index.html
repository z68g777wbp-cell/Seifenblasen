<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2456a6">
<title>DENKAVO · Seifenblasen</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <header class="top">
<div class="heading"><h1>Seifenblasen</h1><p>Fange die Ergebnisse deiner Malreihe!</p></div>
  </header>
  <section class="toolbar" aria-label="Malreihe wählen">
    <div class="tables" id="tables">
      <button class="table-btn active" data-table="3">3</button><button class="table-btn" data-table="4">4</button>
      <button class="table-btn" data-table="6">6</button><button class="table-btn" data-table="7">7</button>
      <button class="table-btn" data-table="8">8</button><button class="table-btn" data-table="9">9</button>
    </div>
    <div class="speeds" aria-label="Geschwindigkeit">
      <button class="speed-btn" data-speed="turtle" title="Langsam" aria-label="Langsam">🐢</button>
      <button class="speed-btn active" data-speed="horse" title="Mittel" aria-label="Mittel">🐎</button>
      <button class="speed-btn" data-speed="cheetah" title="Schnell" aria-label="Schnell">🐆</button>
    </div>
  </section>
  <section class="game-wrap">
    <div class="hud"><span class="pill">Gefangen: <b id="progress">0 / 10</b></span><span class="pill">Zeit: <b id="timer">0:00</b></span><button id="restart" class="small-btn">Neu starten ↻</button></div>
    <div id="arena" class="arena" aria-label="Spielfeld mit Seifenblasen"></div>
    <div class="star-track" id="starTrack" aria-label="Gesammelte Sterne"></div>
  </section>
  <section id="result" class="result" hidden>
    <div class="result-card"><div class="celebrate">✨🌟✨</div><h2>Geschafft!</h2><p id="resultText"></p><p id="mistakes"></p><button id="again" class="primary">Noch einmal spielen</button></div>
  </section>
  <footer>Tippe auf die Blase mit dem Ergebnis. Viel Erfolg!</footer>
</main>
<script src="game.js"></script>
</body>
</html>
